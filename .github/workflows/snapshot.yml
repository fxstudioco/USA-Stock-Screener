name: Market data snapshot

# Builds public/data/snapshot.json (daily, after the US close) and
# public/data/backtest.json (weekly), commits them, and Vercel redeploys automatically.
on:
  schedule:
    # 22:17 UTC Mon–Fri = 17:17 EST / 18:17 EDT (always after the 16:00 ET close)
    - cron: "17 22 * * 1-5"
    # Weekly backtest refresh: Saturday 03:23 UTC
    - cron: "23 3 * * 6"
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also re-run the 11-year backtest"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Daily snapshot
        run: npm run snapshot
      - name: Weekly backtest
        if: github.event.schedule == '23 3 * * 6' || inputs.backtest == true
        run: npm run backtest -- --write
      - name: Commit data if changed
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
